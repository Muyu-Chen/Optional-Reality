<VirtualHost *:80>
    ServerName muuyyy.cfd
    ServerAlias optionalreality.site www.optionalreality.site
    DocumentRoot /var/www/muu-tech/current
    ErrorLog ${APACHE_LOG_DIR}/muu-tech-error.log
    CustomLog ${APACHE_LOG_DIR}/muu-tech-access.log combined

    <Directory /var/www/muu-tech/>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    # Keep HTTP-01 validation reachable for the single three-name SAN certificate.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTP_HOST} ^(muuyyy\.cfd|optionalreality\.site|www\.optionalreality\.site)(?::80)?$ [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L,NE]
    # Unknown hosts are never reflected in a redirect.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://muuyyy.cfd%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
