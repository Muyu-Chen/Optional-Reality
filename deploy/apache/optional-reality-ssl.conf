<VirtualHost *:443>
    ServerName optionalreality.site
    ServerAlias www.optionalreality.site
    DocumentRoot /var/www/muu-tech/current
    ErrorLog ${APACHE_LOG_DIR}/optional-reality-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/optional-reality-ssl-access.log combined

    # Reuse the existing lineage, expanded to all three names; no second certificate.
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/muuyyy.cfd/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/muuyyy.cfd/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/muu-tech/>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
        <FilesMatch "\.(css|js|svg)$">
            Header set Cache-Control "public, max-age=3600"
        </FilesMatch>
        <FilesMatch "\.(html|xml|txt)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/xml text/plain
    </Directory>

    # Only the game is shared. The original camera proxy stays on muuyyy.cfd.
    Include /etc/apache2/optional-reality-game.conf
</VirtualHost>
