# Shared by both HTTPS virtual hosts; assets retain their existing /demo/ URLs.
RewriteEngine On
RewriteRule ^/$ /demo/index.html [PT,L]
RewriteRule ^/index\.html$ /intro [R=301,L,NE]
AliasMatch "^/intro/?$" "/var/www/muu-tech/current/index.html"

ProxyRequests Off
ProxyPreserveHost On
ProxyPass "/api/" "http://127.0.0.1:3001/api/" connectiontimeout=5 timeout=40
ProxyPassReverse "/api/" "http://127.0.0.1:3001/api/"
<Location "/api/">
    Header always set Cache-Control "no-store"
</Location>
<LocationMatch "^/(?:$|demo(?:/|$))">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
    Header always set Cache-Control "no-cache"
</LocationMatch>
